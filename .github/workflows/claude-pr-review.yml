name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropic/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-opus-4-8
          direct_prompt: |
            Review this pull request for the qr-to-dxf npm package.
            Consult CLAUDE.md in the repository root for full project context,
            quality standards, and the open issue backlog.

            Specifically check:
            1. **Type safety** — no unsafe casts, no `any` without justification
            2. **Input validation** — new public API functions must validate at the boundary
            3. **DXF spec compliance** — if dxf-writer.ts is touched, verify entity structure
               (SOLID needs 4 points, HATCH boundary must close, LWPOLYLINE vertex order)
            4. **Test coverage** — new functionality needs tests; coverage thresholds must hold
               (lines/functions/statements ≥80%, branches ≥70%)
            5. **API surface** — breaking changes require `feat!:` title or `BREAKING CHANGE:` footer
            6. **Conventional Commits** — PR title must follow the format
            7. **Known issues** — if the PR touches areas tracked in the issue backlog,
               call that out and check if it resolves or worsens the situation

            Be specific with file:line references. If there are no blocking issues, approve.
